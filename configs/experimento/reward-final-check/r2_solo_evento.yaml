# R2 · SOLO EVENTO
#
# Unicamente el componente event de configs/reward_weights/stage_1_basics.yaml
# (heredado), con su peso y sus kwargs EXACTAMENTE como estaban: 8.0 y
# goal 1.0, concede -1.0, shot 0.1, demo 0.1.
#
# Se eliminan los tres terminos densos: velocity_player_to_ball, face_ball y
# velocity_ball_to_goal. No queda ningun shaping continuo.
#
# zero_sum, team_spirit y opp_scale se mantienen como en el heredado.
zero_sum: true
team_spirit: 0.0
opp_scale: 1.0
components:
  - name: event
    weight: 8.0
    kwargs:
      goal: 1.0
      concede: -1.0
      shot: 0.1
      demo: 0.1
