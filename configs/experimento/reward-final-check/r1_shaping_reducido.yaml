# R1 · SHAPING REDUCIDO
#
# Copia de configs/reward_weights/stage_1_basics.yaml (heredado) con UN solo
# cambio: los tres terminos moldeados densos se dividen por 10.
#
#   velocity_player_to_ball  0.10 -> 0.010
#   face_ball                0.05 -> 0.005
#   velocity_ball_to_goal    0.30 -> 0.030
#
# El componente event queda EXACTAMENTE igual: peso 8.0 y los mismos kwargs.
# zero_sum, team_spirit y opp_scale tampoco se tocan.
zero_sum: true
team_spirit: 0.0
opp_scale: 1.0
components:
  - name: velocity_player_to_ball
    weight: 0.010
  - name: face_ball
    weight: 0.005
  - name: velocity_ball_to_goal
    weight: 0.030
  - name: event
    weight: 8.0
    kwargs:
      goal: 1.0
      concede: -1.0
      shot: 0.1
      demo: 0.1
